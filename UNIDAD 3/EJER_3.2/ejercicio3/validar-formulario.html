<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Formulario</title>
</head>
<body>
    
    <h1>Formulario de registro</h1>

    <!-- Formulario con nombre y email -->
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">

        <br><br>

        <label for="email">Email:</label>
        <input type="text" id="email">

        <br><br>

        <!-- Botón para comprobar los datos -->
        <button type="button" onclick="generarInformeDeValidacion()">
            Validar formulario
        </button>
    </form>

    <!-- Aquí aparecerán los errores -->
    <div id="informe-errores"></div>

    <script>
        function generarInformeDeValidacion(){
            let nombre = document.getElementById("nombre").value
            let email = document.getElementById("email").value

            let informe = document.getElementById("informe-errores")
            informe.innerHTML = ""

            if(nombre.lenght <= 3){
                let error = document.createElement("p")
                error.textContent= "El nombre es incorrecto"
                informe.appendChild(error)
            }

            if(!email.include("@")){
                let error = document.createElement("p")
                error.textContent= "El email es incorrecto"
                informe.appendChild(error)
            }

            if(nombre.lenght > 3 && email.include("@")){
                let mensaje = document.createElement("p")
                error.textContent= "Formulario valido"
                informe.appendChild(mensaje)
            }
        }

    </script>
</body>
</html>
